<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartFarm Protection System{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-green-800 text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-paw text-2xl"></i>
                    <h1 class="text-2xl font-bold">SmartFarm Protection System</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="/" class="hover:text-yellow-300 transition duration-200 {% if request.path == '/' %}text-yellow-300 border-b-2 border-yellow-300{% endif %}">
                        <i class="fas fa-video mr-2"></i>Live Monitor
                    </a>
                    <a href="/dashboard" class="hover:text-yellow-300 transition duration-200 {% if request.path == '/dashboard' %}text-yellow-300 border-b-2 border-yellow-300{% endif %}">
                        <i class="fas fa-chart-bar mr-2"></i>Analytics
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-green-800 text-white py-6 mt-12">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2024 Wildlife Guardian AI. Smart Farm Protection System.</p>
            <p class="text-green-200 text-sm mt-2">Powered by AI & Computer Vision</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
